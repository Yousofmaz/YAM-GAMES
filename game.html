<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة حروف التفاعلية | YAM Games</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        .hexagon { clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%); transition: all 0.2s ease; }
        .fade-in { animation: fadeIn 0.3s ease-in-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-gray-950 text-white font-sans min-h-screen flex flex-col justify-between select-none">

    <!-- الهيدر -->
    <header class="bg-gray-900 border-b border-gray-800 p-4 sticky top-0 z-40 shadow-md">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-black text-green-400 flex items-center gap-2">
                <span>🎮</span> YAM Games - لعبة حروف
            </h1>
            <div class="flex gap-2">
                <a href="index.html" class="bg-gray-800 hover:bg-gray-700 text-gray-300 px-3.5 py-2 rounded-xl text-xs font-bold transition">المتجر</a>
                <a href="admin.html" target="_blank" class="bg-green-600/20 text-green-400 px-3.5 py-2 rounded-xl text-xs font-bold transition border border-green-500/30">الإدارة ⚙️</a>
            </div>
        </div>
    </header>

    <!-- المحتوى الرئيسي -->
    <main class="max-w-2xl mx-auto p-4 flex-1 w-full flex flex-col items-center justify-center my-4">
        
        <!-- لوحة الحروف بالأطراف المطابقة للصورة (أعلى وأسفل أحمر، يمين ويسار أخضر) -->
        <div class="w-full bg-white border-t-8 border-b-8 border-red-600 border-l-8 border-r-8 border-green-600 rounded-3xl p-5 shadow-2xl relative">
            
            <!-- معلومات الفرق -->
            <div class="flex justify-between items-center mb-4 bg-gray-100 p-3 rounded-2xl border border-gray-200 text-gray-900">
                <div>
                    <h3 class="font-black text-xs md:text-sm" id="turn-indicator">دور الفريق: <span class="text-red-600">الفريق الأحمر</span></h3>
                </div>
                <div class="flex gap-2 text-xs font-bold">
                    <span class="bg-red-100 text-red-700 px-3 py-1 rounded-xl border border-red-200">أحمر: <span id="score-red">0</span></span>
                    <span class="bg-green-100 text-green-800 px-3 py-1 rounded-xl border border-green-200">أخضر: <span id="score-green">0</span></span>
                </div>
            </div>

            <!-- شبكة الحروف السداسية -->
            <div id="board-grid" class="grid grid-cols-6 gap-2 max-w-md mx-auto p-3 bg-gray-100 rounded-2xl border border-gray-200 mb-4"></div>

            <div class="text-center">
                <button onclick="resetBoardRandomly()" class="bg-gray-900 hover:bg-gray-800 text-white px-5 py-2 rounded-xl text-xs font-bold transition shadow">
                    🔄 تغيير وتوزيع الحروف عشوائياً
                </button>
            </div>
        </div>

        <!-- منطقة عرض السؤال أسفل اللوحة -->
        <div id="question-box-container" class="w-full mt-4 bg-gray-900 border border-gray-800 rounded-2xl p-4 shadow-xl hidden fade-in text-center">
            <span id="active-letter-badge" class="bg-green-500/20 text-green-400 px-3 py-1 rounded-full text-xs font-black inline-block mb-2">الحرف</span>
            <p id="question-text" class="text-sm md:text-base font-bold text-gray-100 mb-4 leading-relaxed">اختر حرفاً لبدء السؤال...</p>
            <button onclick="openAnswerModal()" class="bg-yellow-500 hover:bg-yellow-400 text-gray-950 font-black px-6 py-2.5 rounded-xl text-xs transition shadow-lg">
                إظهار الإجابة 👁️
            </button>
        </div>

    </main>

    <!-- النافذة المنبثقة للإجابة وأزرار التقييم -->
    <div id="answer-modal" class="fixed inset-0 bg-black/80 hidden z-50 flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-gray-900 border border-green-500/40 w-full max-w-sm rounded-3xl p-6 shadow-2xl text-center relative fade-in">
            <span class="text-xs text-gray-400 block mb-1 font-bold">الإجابة الصحيحة هي:</span>
            <h3 id="answer-text" class="text-lg md:text-xl font-black text-yellow-400 mb-6 leading-relaxed bg-gray-950 p-3 rounded-xl border border-gray-800">الإجابة هنا</h3>

            <div class="grid grid-cols-2 gap-3">
                <button onclick="evaluateAnswer(true)" class="bg-green-600 hover:bg-green-500 text-gray-950 font-black py-3 rounded-xl text-xs transition shadow-lg shadow-green-600/30">
                    الإجابة صح ✓
                </button>
                <button onclick="evaluateAnswer(false)" class="bg-red-600 hover:bg-red-500 text-white font-black py-3 rounded-xl text-xs transition shadow-lg shadow-red-600/30">
                    الإجابة خطأ ✕
                </button>
            </div>
        </div>
    </div>

    <!-- الفوتر -->
    <footer class="bg-gray-900 border-t border-gray-800 py-3 text-center text-gray-500 text-xs">
        YAM Games &copy; 2026 - جميع الحقوق محفوظة
    </footer>

    <!-- سكريبت اللعبة وقاعدة البيانات الضخمة -->
    <script>
        // قاعدة بيانات ضخمة ومتنوعة للأسئلة والحروف
        const massiveQuestionPool = {
            'أ': [
                { q: 'ما هو أطول نهر في العالم؟', a: 'نهر النيل' },
                { q: 'أول سورة نزلت في القرآن الكريم؟', a: 'سورة العلق' },
                { q: 'أكبر دولة في العالم من حيث المساحة؟', a: 'روسيا' }
            ],
            'ب': [
                { q: 'دولة عاصمتها برلين؟', a: 'ألمانيا' },
                { q: 'معدن يُعرف بالتبر الأسود؟', a: 'البترول' },
                { q: 'عاصمة لبنان؟', a: 'بيروت' }
            ],
            'ت': [
                { q: 'حيوان يحب الموز ويشبه الإنسان؟', a: 'القرد' },
                { q: 'أول معركة فاصلة في فتوحات فارس؟', a: 'معركة القادسية (تنتهي بتاء التأسيس أو التوكيد)' },
                { q: 'دولة عربية تونس عاصمتها؟', a: 'تونس' }
            ],
            'ث': [
                { q: 'كم ثانية في الدقيقة الواحدة؟', a: '60 ثانية' },
                { q: 'حيوان مفترس يلقب بأبو حبة؟', a: 'الثعلب' },
                { q: 'عدد الثعابين في رأس المدوسة في الأسطورة؟', a: 'كثير جداً' }
            ],
            'ج': [
                { q: 'ما هو أكبر كوكب في المجموعة الشمسية؟', a: 'المشتري' },
                { q: 'دولة عاصمتها الجزائر؟', a: 'الجزائر' },
                { q: 'حيوان سفينة الصحراء؟', a: 'الجمل' }
            ],
            'ح': [
                { q: 'عاصمة المملكة العربية السعودية؟', a: 'الرياض' },
                { q: 'أسرع حيوان بحري؟', a: 'الحوت الأزرق' },
                { q: 'عضو التنفس الرئيسي عند الإنسان؟', a: 'الرئة' }
            ],
            'خ': [
                { q: 'أسرع حيوان بري في العالم؟', a: 'الفهد (الشيتا)' },
                { q: 'ما هو الخوخ باللغة الإنجليزية؟', a: 'Peach' },
                { q: 'الخضروات الورقية الغنية بالحديد؟', a: 'السبانخ' }
            ],
            'د': [
                { q: 'عنصر كيميائي رمزه Au؟', a: 'الذهب' },
                { q: 'عاصمة دولة الإمارات العربية المتحدة؟', a: 'أبوظبي' },
                { q: 'حيوان يلقب بأبو الحصين؟', a: 'الثعلب' }
            ],
            'ر': [
                { q: 'سورة قرآنية تسمى قلب القرآن؟', a: 'سورة يس' },
                { q: 'عاصمة فرنسا؟', a: 'باريس' },
                { q: 'أطول سلسلة جبال في العالم؟', a: 'جبال الأنديز' }
            ],
            'ز': [
                { q: 'معدن ثمين يُقاس بالأونصة؟', a: 'الذهب' },
                { q: 'فاكهة صيفية غنية بالماء ومن فصيلة القرعيات؟', a: 'البطيخ (الحبحب)' },
                { q: 'عاصمة تنزانيا السابقة وأكبر مدنها؟', a: 'دار السلام' }
            ],
            'س': [
                { q: 'نبي ألقي في النار فجعلها برداً وسلاماً؟', a: 'إبراهيم عليه السلام' },
                { q: 'أكبر محيط في العالم؟', a: 'المحيط الهادئ' },
                { q: 'عاصمة سوريا؟', a: 'دمشق' }
            ],
            'ش': [
                { q: 'ما هي عاصمة مصر؟', a: 'القاهرة' },
                { q: 'شهر صيام المسلمين؟', a: 'شهر رمضان' },
                { q: 'أصل الشاي الأخضر يعود إلى دولة؟', a: 'الصين' }
            ],
            'ص': [
                { q: 'في أي دولة تقع مدينة إسطنبول؟', a: 'تركيا' },
                { q: 'صلاة تصلى بدون ركوع ولا سجود؟', a: 'صلاة الجنازة' },
                { q: 'صاحب لقب أمير الشعراء؟', a: 'أحمد شوقي' }
            ],
            'ض': [
                { q: 'عدد ركعات صلاة العشاء؟', a: '4 ركعات' },
                { q: 'الحرف الوحيد الذي يتميز بصوت الضاد؟', a: 'حرف الضاد' },
                { q: 'فصل من فصول السنة يتميز بالبرودة الشديدة؟', a: 'الشتاء' }
            ],
            'ط': [
                { q: 'طائر يستطيع طهي الطعام؟', a: 'طائر البطريق' },
                { q: 'دولة عربية عاصمتها مسقط؟', a: 'سلطنة عمان' },
                { q: 'عنصر معدني قابل للسحب والطرق رمزه Ti؟', a: 'التيتانيوم' }
            ],
            'ظ': [
                { q: 'حيوان يسمى ظبي أو...', a: 'الغزال' },
                { q: 'الظل يطول ويقصر بناءً على حركة؟', a: 'الشمس' },
                { q: 'أداة تُستخدم لمعرفة اتجاه القبلة أو الشمال؟', a: 'البوصلة' }
            ],
            'ع': [
                { q: 'أول غزوة في الإسلام؟', a: 'غزوة الأبواء (ودان)' },
                { q: 'عاصمة العراق؟', a: 'بغداد' },
                { q: 'أكبر كوكب في المجموعة الشمسية؟', a: 'المشتري' }
            ],
            'غ': [
                { q: 'عاصمة بريطانيا؟', a: 'لندن' },
                { q: 'حيوان أبيض يعيش في القطب الشمالي؟', a: 'الدب القطبي' },
                { q: 'غاز يمثل النسبة الأكبر في الغلاف الجوي؟', a: 'النيتروجين' }
            ],
            'ف': [
                { q: 'عاصمة إيطاليا؟', a: 'روما' },
                { q: 'أول رائد فضاء عربي؟', a: 'سلطان بن سلمان' },
                { q: 'فاكهة مفيدة جداً وتحتوي على فيتامين C؟', a: 'البرتقال' }
            ],
            'ق': [
                { q: 'القارة القطبية الجنوبية تسمى؟', a: 'أنتاركتيكا' },
                { q: 'سورة في القرآن تسمى عروس القرآن؟', a: 'سورة الرحمن' },
                { q: 'دولة عربية عاصمتها الدوحة؟', a: 'قطر' }
            ],
            'ك': [
                { q: 'عاصمة الكويت؟', a: 'الكويت' },
                { q: 'أكبر حيوان ثديي بحري؟', a: 'الحوت الأزرق' },
                { q: 'دولة أوروبية تشتهر بصناعة الساعات والشوكولاتة؟', a: 'سويسرا' }
            ],
            'ل': [
                { q: 'عاصمة بريطانيا؟', a: 'لندن' },
                { q: 'معدن سائل يُستخدم في الترمومترات؟', a: 'الزئبق' },
                { q: 'عاصمة ليبيا؟', a: 'طرابلس' }
            ],
            'م': [
                { q: 'عاصمة سلطنة عمان؟', a: 'مسقط' },
                { q: 'معركة اسلامية كبرى تسمى يوم الفرقان؟', a: 'معركة بدر' },
                { q: 'أطول نخلة في العالم توجد في؟', a: 'المنطقة العربية' }
            ],
            'ن': [
                { q: 'نهر يمر عبر مصر والسودان؟', a: 'نهر النيل' },
                { q: 'عاصمة السودان؟', a: 'خرطوم' },
                { q: 'عنصر كيميائي رمزه Na؟', a: 'الصوديوم' }
            ],
            'هـ': [
                { q: 'هرم تركي أو مصري شهير؟', a: 'أهرامات الجيزة' },
                { q: 'عاصمة هولندا؟', a: 'أمستردام' },
                { q: 'حيوانات ضخمة انقرضت منذ آلاف السنين؟', a: 'الديناصورات' }
            ],
            'و': [
                { q: 'واسع وممتد ويحيط باليابسة؟', a: 'المحيط' },
                { q: 'وزير سليمان عليه السلام في القصة؟', a: 'آصف بن برخيا' },
                { q: 'دولة عاصمتها واشنطن؟', a: 'الولايات المتحدة الأمريكية' }
            ],
            'ي': [
                { q: 'عاصمة اليمن؟', a: 'صنعاء' },
                { q: 'يوم الجمعة يسمى في الإسلام بـ؟', a: 'سيد الأيام' },
                { q: 'بحر فاصل بين قارة آسيا وأفريقيا؟', a: 'البحر الأحمر' }
            ]
        };

        let currentLettersData = [];
        let selectedCellIndex = null;
        let currentTurn = 'red';
        let scoreRed = 0;
        let scoreGreen = 0;
        let activeQuestionObj = null;

        // خلط الحروف وتوزيعها عشوائياً
        function resetBoardRandomly() {
            let allKeys = Object.keys(massiveQuestionPool);
            let shuffledKeys = allKeys.sort(() => 0.5 - Math.random()).slice(0, 18);
            
            currentLettersData = shuffledKeys.map(letter => {
                let qList = massiveQuestionPool[letter];
                let randomQ = qList[Math.floor(Math.random() * qList.length)];
                return {
                    letter: letter,
                    q: randomQ.q,
                    a: randomQ.a,
                    owner: null
                };
            });

            renderBoard();
            document.getElementById('question-box-container').classList.add('hidden');
        }

        function renderBoard() {
            let gridEl = document.getElementById('board-grid');
            let html = '';
            currentLettersData.forEach((item, index) => {
                let bgColor = 'bg-white text-gray-900 hover:bg-gray-100 border border-gray-300 shadow-sm';
                if (item.owner === 'red') bgColor = 'bg-red-600 text-white shadow-md border-red-500';
                if (item.owner === 'green') bgColor = 'bg-green-600 text-white shadow-md border-green-500';

                html += `<div onclick="selectCell(${index})" class="hexagon h-12 flex items-center justify-center font-black text-sm cursor-pointer ${bgColor} transition transform hover:scale-105">
                    ${item.letter}
                </div>`;
            });
            gridEl.innerHTML = html;
        }

        // اختيار الحرف وإظهار السؤال أسفل اللوحة
        function selectCell(index) {
            if (currentLettersData[index].owner !== null) return;
            selectedCellIndex = index;
            activeQuestionObj = currentLettersData[index];

            document.getElementById('active-letter-badge').innerText = 'حرف ' + activeQuestionObj.letter;
            document.getElementById('question-text').innerText = activeQuestionObj.q;
            document.getElementById('question-box-container').classList.remove('hidden');
            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
        }

        // فتح نافذة الإجابة المنبثقة
        function openAnswerModal() {
            if(!activeQuestionObj) return;
            document.getElementById('answer-text').innerText = activeQuestionObj.a;
            document.getElementById('answer-modal').classList.remove('hidden');
        }

        // تقييم الإجابة (صح أو خطأ)
        function evaluateAnswer(isCorrect) {
            document.getElementById('answer-modal').classList.add('hidden');
            document.getElementById('question-box-container').classList.add('hidden');

            if (isCorrect) {
                currentLettersData[selectedCellIndex].owner = currentTurn;
                if(currentTurn === 'red') scoreRed++;
                else scoreGreen++;

                document.getElementById('score-red').innerText = scoreRed;
                document.getElementById('score-green').innerText = scoreGreen;
            }

            // تبديل الدور بغض النظر عن الإجابة أو عند الخطأ
            currentTurn = currentTurn === 'red' ? 'green' : 'red';
            updateTurnText();
            renderBoard();
        }

        function updateTurnText() {
            let el = document.getElementById('turn-indicator');
            if(currentTurn === 'red') {
                el.innerHTML = 'دور الفريق: <span class="text-red-600">الفريق الأحمر</span>';
            } else {
                el.innerHTML = 'دور الفريق: <span class="text-green-700">الفريق الأخضر</span>';
            }
        }

        // التشغيل التلقائي عند التحميل
        window.onload = function() {
            resetBoardRandomly();
        }
    </script>
</body>
</html>
