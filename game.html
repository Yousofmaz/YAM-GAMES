<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة حروف التفاعلية | YAM Games</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        .hexagon { clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%); transition: all 0.2s ease; }
        .fade-in { animation: fadeIn 0.3s ease-in-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-gray-950 text-white font-sans min-h-screen flex flex-col justify-between select-none">

    <!-- نافذة تسجيل دخول العملاء (إذا لم يكن مسجلاً) -->
    <div id="customer-login-modal" class="fixed inset-0 bg-black/90 z-50 flex items-center justify-center p-4">
        <div class="bg-gray-900 border border-green-500/30 w-full max-w-sm rounded-3xl p-6 shadow-2xl text-center">
            <h3 class="text-lg font-black text-green-400 mb-2">تسجيل دخول العميل 🎮</h3>
            <p class="text-gray-400 text-xs mb-6">أدخل اسم المستخدم وكلمة المرور الخاصة بلعبتك</p>
            <form onsubmit="handleCustomerLogin(event)" class="space-y-4 text-right">
                <div>
                    <label class="block text-xs font-bold text-gray-300 mb-1">اسم المستخدم (Username)</label>
                    <input type="text" id="cust-user" required class="w-full bg-gray-950 border border-gray-800 rounded-xl p-3 text-sm text-white outline-none focus:border-green-500">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-300 mb-1">كلمة المرور (Password)</label>
                    <input type="password" id="cust-pass" required class="w-full bg-gray-950 border border-gray-800 rounded-xl p-3 text-sm text-white outline-none focus:border-green-500">
                </div>
                <button type="submit" class="w-full bg-green-600 hover:bg-green-500 text-gray-950 font-black py-3 rounded-xl text-sm transition shadow-lg">
                    دخول للعبة 🚀
                </button>
            </form>
        </div>
    </div>

    <!-- الهيدر مع الترحيب بالعميل أعلى اليسار -->
    <header class="bg-gray-900 border-b border-gray-800 p-4 sticky top-0 z-40 shadow-md">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <h1 class="text-base md:text-xl font-black text-green-400 flex items-center gap-2">
                <span>🎮</span> YAM Games
            </h1>
            <div class="flex items-center gap-3">
                <span id="welcome-user-display" class="text-xs md:text-sm font-bold text-yellow-400 bg-gray-950 px-3 py-1.5 rounded-xl border border-gray-800">مرحبا...</span>
                <a href="index.html" class="bg-gray-800 hover:bg-gray-700 text-gray-300 px-3 py-1.5 rounded-xl text-xs font-bold transition">المتجر</a>
            </div>
        </div>
    </header>

    <!-- المحتوى الرئيسي للعبة -->
    <main class="max-w-2xl mx-auto p-4 flex-1 w-full flex flex-col items-center justify-center my-4">
        
        <!-- لوحة الحروف المطابقة تماماً للصورة (أعلى وأسفل أحمر، يمين ويسار أخضر) -->
        <div class="w-full bg-white border-t-8 border-b-8 border-red-600 border-l-8 border-r-8 border-green-600 rounded-3xl p-4 md:p-6 shadow-2xl relative">
            
            <!-- معلومات الفرق والنتائج -->
            <div class="flex justify-between items-center mb-4 bg-gray-100 p-3 rounded-2xl border border-gray-200 text-gray-900">
                <div>
                    <h3 class="font-black text-xs md:text-sm" id="turn-indicator">دور الفريق: <span class="text-red-600">الفريق الأحمر</span></h3>
                </div>
                <div class="flex gap-2 text-xs font-bold">
                    <span class="bg-red-100 text-red-700 px-3 py-1 rounded-xl border border-red-200">أحمر: <span id="score-red">0</span></span>
                    <span class="bg-green-100 text-green-800 px-3 py-1 rounded-xl border border-green-200">أخضر: <span id="score-green">0</span></span>
                </div>
            </div>

            <!-- شبكة الحروف السداسية الكلاسيكية -->
            <div id="board-grid" class="grid grid-cols-6 gap-1.5 md:gap-2 max-w-md mx-auto p-3 bg-gray-100 rounded-2xl border border-gray-200 mb-4"></div>

            <div class="text-center">
                <button onclick="resetBoardRandomly()" class="bg-gray-900 hover:bg-gray-800 text-white px-5 py-2 rounded-xl text-xs font-bold transition shadow">
                    🔄 تغيير وتوزيع الحروف عشوائياً
                </button>
            </div>
        </div>

        <!-- منطقة السؤال والمؤقت أسفل اللوحة -->
        <div id="question-box-container" class="w-full mt-4 bg-gray-900 border border-gray-800 rounded-2xl p-4 shadow-xl hidden fade-in text-center relative">
            <div class="absolute top-3 left-3 bg-gray-950 px-3 py-1 rounded-xl border border-gray-800 text-sm font-mono text-yellow-400" id="timer-display">15</div>
            
            <span id="active-letter-badge" class="bg-green-500/20 text-green-400 px-3 py-1 rounded-full text-xs font-black inline-block mb-2">الحرف</span>
            <p id="question-text" class="text-sm md:text-base font-bold text-gray-100 mb-4 leading-relaxed">اختر حرفاً لبدء السؤال...</p>
            <button onclick="openAnswerModal()" class="bg-yellow-500 hover:bg-yellow-400 text-gray-950 font-black px-6 py-2.5 rounded-xl text-xs transition shadow-lg">
                إظهار الإجابة 👁️
            </button>
        </div>

    </main>

    <!-- النافذة المنبثقة للإجابة وزري الصح والخطأ -->
    <div id="answer-modal" class="fixed inset-0 bg-black/80 hidden z-50 flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-gray-900 border border-green-500/40 w-full max-w-sm rounded-3xl p-6 shadow-2xl text-center relative fade-in">
            <span class="text-xs text-gray-400 block mb-1 font-bold">الإجابة الصحيحة هي:</span>
            <h3 id="answer-text" class="text-lg md:text-xl font-black text-yellow-400 mb-6 leading-relaxed bg-gray-950 p-3 rounded-xl border border-gray-800">الإجابة هنا</h3>

            <div class="grid grid-cols-2 gap-3">
                <button onclick="evaluateAnswer(true)" class="bg-green-600 hover:bg-green-500 text-gray-950 font-black py-3 rounded-xl text-xs transition shadow-lg">
                    الإجابة صح ✓
                </button>
                <button onclick="evaluateAnswer(false)" class="bg-red-600 hover:bg-red-500 text-white font-black py-3 rounded-xl text-xs transition shadow-lg">
                    الإجابة خطأ ✕
                </button>
            </div>
        </div>
    </div>

    <!-- الفوتر -->
    <footer class="bg-gray-900 border-t border-gray-800 py-3 text-center text-gray-500 text-xs">
        YAM Games &copy; 2026 - جميع الحقوق محفوظة
    </footer>

    <!-- السكريبت المطور -->
    <script>
        // التحقق من تسجيل دخول العميل
        function handleCustomerLogin(e) {
            e.preventDefault();
            let user = document.getElementById('cust-user').value;
            let pass = document.getElementById('cust-pass').value;
            
            if(user && pass) {
                localStorage.setItem('yam_current_customer', user);
                document.getElementById('customer-login-modal').classList.add('hidden');
                document.getElementById('welcome-user-display').innerText = 'مرحبا ' + user;
            }
        }

        window.onload = function() {
            let activeCust = localStorage.getItem('yam_current_customer');
            if(activeCust) {
                document.getElementById('customer-login-modal').classList.add('hidden');
                document.getElementById('welcome-user-display').innerText = 'مرحبا ' + activeCust;
            }
            resetBoardRandomly();
        }

        const massiveQuestionPool = {
            'أ': [{ q: 'ما هو أطول نهر في العالم؟', a: 'نهر النيل' }, { q: 'أول سورة نزلت في القرآن؟', a: 'سورة العلق' }],
            'ب': [{ q: 'دولة عاصمتها برلين؟', a: 'ألمانيا' }, { q: 'عاصمة لبنان؟', a: 'بيروت' }],
            'ت': [{ q: 'حيوان يحب الموز ويشبه الإنسان؟', a: 'القرد' }, { q: 'دولة عربية عاصمتها تونس؟', a: 'تونس' }],
            'ث': [{ q: 'كم ثانية في الدقيقة الواحدة؟', a: '60 ثانية' }, { q: 'حيوان يلقب بأبو حبة؟', a: 'الثعلب' }],
            'ج': [{ q: 'أكبر كوكب في المجموعة الشمسية؟', a: 'المشتري' }, { q: 'حيوان سفينة الصحراء؟', a: 'الجمل' }],
            'ح': [{ q: 'عاصمة المملكة العربية السعودية؟', a: 'الرياض' }, { q: 'عضو التنفس الرئيسي؟', a: 'الرئة' }],
            'خ': [{ q: 'أسرع حيوان بري في العالم؟', a: 'الفهد (الشيتا)' }],
            'د': [{ q: 'عنصر كيميائي رمزه Au؟', a: 'الذهب' }, { q: 'عاصمة الإمارات؟', a: 'أبوظبي' }],
            'ر': [{ q: 'سورة قرآنية تسمى قلب القرآن؟', a: 'سورة يس' }, { q: 'عاصمة فرنسا؟', a: 'باريس' }],
            'ز': [{ q: 'معدن ثمين يُقاس بالأونصة؟', a: 'الذهب' }],
            'س': [{ q: 'نبي ألقي في النار فجعلها برداً وسلاماً؟', a: 'إبراهيم عليه السلام' }],
            'ش': [{ q: 'ما هي عاصمة مصر؟', a: 'القاهرة' }, { q: 'شهر صيام المسلمين؟', a: 'شهر رمضان' }],
            'ص': [{ q: 'في أي دولة تقع إسطنبول؟', a: 'تركيا' }],
            'ض': [{ q: 'عدد ركعات صلاة العشاء؟', a: '4 ركعات' }],
            'ط': [{ q: 'دولة عربية عاصمتها مسقط؟', a: 'سلطنة عمان' }],
            'ظ': [{ q: 'الظل يطول ويقصر بناءً على حركة؟', a: 'الشمس' }],
            'ع': [{ q: 'أول غزوة في الإسلام؟', a: 'غزوة الأبواء' }, { q: 'عاصمة العراق؟', a: 'بغداد' }],
            'غ': [{ q: 'عاصمة بريطانيا؟', a: 'لندن' }],
            'ف': [{ q: 'عاصمة إيطاليا؟', a: 'روما' }],
            'ق': [{ q: 'دولة عربية عاصمتها الدوحة؟', a: 'قطر' }],
            'ك': [{ q: 'عاصمة الكويت؟', a: 'الكويت' }],
            'ل': [{ q: 'عاصمة بريطانيا؟', a: 'لندن' }],
            'م': [{ q: 'عاصمة سلطنة عمان؟', a: 'مسقط' }],
            'ن': [{ q: 'نهر يمر عبر مصر والسودان؟', a: 'نهر النيل' }],
            'هـ': [{ q: 'عاصمة هولندا؟', a: 'أمستردام' }],
            'و': [{ q: 'دولة عاصمتها واشنطن؟', a: 'الولايات المتحدة' }],
            'ي': [{ q: 'عاصمة اليمن؟', a: 'صنعاء' }]
        };

        let currentLettersData = [];
        let selectedCellIndex = null;
        let currentTurn = 'red';
        let scoreRed = 0;
        let scoreGreen = 0;
        let activeQuestionObj = null;
        let timer = null;
        let timeLeft = 15;

        function resetBoardRandomly() {
            let allKeys = Object.keys(massiveQuestionPool);
            let shuffledKeys = allKeys.sort(() => 0.5 - Math.random()).slice(0, 18);
            
            currentLettersData = shuffledKeys.map(letter => {
                let qList = massiveQuestionPool[letter];
                let randomQ = qList[Math.floor(Math.random() * qList.length)];
                return { letter: letter, q: randomQ.q, a: randomQ.a, owner: null };
            });

            renderBoard();
            document.getElementById('question-box-container').classList.add('hidden');
        }

        function renderBoard() {
            let gridEl = document.getElementById('board-grid');
            let html = '';
            currentLettersData.forEach((item, index) => {
                let bgColor = 'bg-white text-gray-900 hover:bg-gray-100 border border-gray-300 shadow-sm';
                if (item.owner === 'red') bgColor = 'bg-red-600 text-white shadow-md border-red-500';
                if (item.owner === 'green') bgColor = 'bg-green-600 text-white shadow-md border-green-500';

                html += `<div onclick="selectCell(${index})" class="hexagon h-10 md:h-12 flex items-center justify-center font-black text-xs md:text-sm cursor-pointer ${bgColor} transition transform hover:scale-105">
                    ${item.letter}
                </div>`;
            });
            gridEl.innerHTML = html;
        }

        function selectCell(index) {
            if (currentLettersData[index].owner !== null) return;
            selectedCellIndex = index;
            activeQuestionObj = currentLettersData[index];

            document.getElementById('active-letter-badge').innerText = 'حرف ' + activeQuestionObj.letter;
            document.getElementById('question-text').innerText = activeQuestionObj.q;
            document.getElementById('question-box-container').classList.remove('hidden');
            
            startTimer();
            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
        }

        function startTimer() {
            clearInterval(timer);
            timeLeft = 15;
            document.getElementById('timer-display').innerText = timeLeft;
            
            timer = setInterval(() => {
                timeLeft--;
                document.getElementById('timer-display').innerText = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(timer);
                    alert('انتهى الوقت!');
                    document.getElementById('question-box-container').classList.add('hidden');
                    currentTurn = currentTurn === 'red' ? 'green' : 'red';
                    updateTurnText();
                }
            }, 1000);
        }

        function openAnswerModal() {
            if(!activeQuestionObj) return;
            clearInterval(timer);
            document.getElementById('answer-text').innerText = activeQuestionObj.a;
            document.getElementById('answer-modal').classList.remove('hidden');
        }

        function evaluateAnswer(isCorrect) {
            document.getElementById('answer-modal').classList.add('hidden');
            document.getElementById('question-box-container').classList.add('hidden');

            if (isCorrect) {
                currentLettersData[selectedCellIndex].owner = currentTurn;
                if(currentTurn === 'red') scoreRed++;
                else scoreGreen++;

                document.getElementById('score-red').innerText = scoreRed;
                document.getElementById('score-green').innerText = scoreGreen;
            }

            currentTurn = currentTurn === 'red' ? 'green' : 'red';
            updateTurnText();
            renderBoard();
        }

        function updateTurnText() {
            let el = document.getElementById('turn-indicator');
            if(currentTurn === 'red') {
                el.innerHTML = 'دور الفريق: <span class="text-red-600">الفريق الأحمر</span>';
            } else {
                el.innerHTML = 'دور الفريق: <span class="text-green-700">الفريق الأخضر</span>';
            }
        }
    </script>
</body>
</html>
