<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة حروف التفاعلية | YAM Games</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        .hexagon { clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%); transition: all 0.3s ease; }
        .fade-in { animation: fadeIn 0.4s ease-in-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-white text-gray-900 font-sans min-h-screen flex flex-col justify-between select-none">

    <!-- الهيدر -->
    <header class="bg-gray-100 border-b border-gray-200 p-4 sticky top-0 z-40 shadow-sm">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-black text-green-700 flex items-center gap-2">
                <span>🎮</span> YAM Games - لعبة حروف
            </h1>
            <div class="flex gap-2">
                <a href="index.html" class="bg-gray-200 hover:bg-gray-300 text-gray-800 px-3.5 py-2 rounded-xl text-xs font-bold transition">المتجر</a>
                <a href="admin.html" target="_blank" class="bg-green-600 text-white px-3.5 py-2 rounded-xl text-xs font-bold transition">الإدارة ⚙️</a>
            </div>
        </div>
    </header>

    <!-- المحتوى الرئيسي مع الإطار الملون حسب الطلب -->
    <main class="max-w-3xl mx-auto p-4 flex-1 w-full flex items-center justify-center my-6">
        
        <!-- الحواف الملونة: الأيمن والأيسر أخضر، الأعلى والأسفل أحمر -->
        <div class="w-full bg-white border-t-8 border-b-8 border-red-500 border-l-8 border-r-8 border-green-600 rounded-3xl p-6 shadow-2xl relative fade-in">
            
            <div class="flex justify-between items-center mb-6 bg-gray-50 p-4 rounded-2xl border border-gray-200">
                <div>
                    <h3 class="font-black text-sm text-gray-800" id="turn-indicator">دور الفريق: <span class="text-red-600">الفريق الأحمر</span></h3>
                    <p class="text-xs text-gray-500 mt-0.5">اختر حرفاً للإجابة عليه قبل انتهاء الوقت</p>
                </div>
                <div class="flex gap-2 text-xs font-bold">
                    <span class="bg-red-50 text-red-600 px-3 py-1.5 rounded-xl border border-red-200 shadow-sm">أحمر: <span id="score-red">0</span></span>
                    <span class="bg-green-50 text-green-700 px-3 py-1.5 rounded-xl border border-green-200 shadow-sm">أخضر: <span id="score-green">0</span></span>
                </div>
            </div>

            <!-- شبكة الحروف العشوائية المتجددة -->
            <div id="board-grid" class="grid grid-cols-6 gap-2 max-w-lg mx-auto p-4 bg-gray-50 rounded-2xl border border-gray-200 mb-4"></div>

            <div class="text-center">
                <button onclick="resetBoardRandomly()" class="bg-gray-900 hover:bg-gray-800 text-white px-6 py-2.5 rounded-xl text-xs font-bold transition shadow-md">
                    🔄 تغيير وتوزيع الحروف عشوائياً
                </button>
            </div>
        </div>

    </main>

    <!-- نافذة السؤال والمؤقت -->
    <div id="question-modal" class="fixed inset-0 bg-black/60 hidden z-50 flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white border border-gray-200 w-full max-w-sm rounded-3xl p-6 shadow-2xl text-center relative fade-in">
            <div class="absolute top-4 left-4 bg-gray-100 px-3 py-1.5 rounded-xl border border-gray-200 text-lg font-mono text-red-600 shadow-inner" id="timer-display">15</div>
            
            <span id="modal-letter" class="bg-green-100 text-green-800 px-4 py-1.5 rounded-full text-xs font-black inline-block mb-3">حرف</span>
            <h3 id="modal-question" class="text-sm font-bold text-gray-900 mb-6 leading-relaxed">السؤال هنا...</h3>

            <div class="grid grid-cols-2 gap-2 mb-3">
                <button onclick="answerResult('red')" class="bg-red-600 hover:bg-red-500 text-white font-bold py-3 rounded-xl text-xs transition shadow-md">إجابة صحيحة (أحمر)</button>
                <button onclick="answerResult('green')" class="bg-green-600 hover:bg-green-500 text-white font-bold py-3 rounded-xl text-xs transition shadow-md">إجابة صحيحة (أخضر)</button>
            </div>
            <button onclick="closeQuestion(true)" class="w-full bg-gray-100 hover:bg-gray-200 text-gray-600 py-2.5 rounded-xl text-xs transition">إلغاء / تخطي</button>
        </div>
    </div>

    <!-- الفوتر -->
    <footer class="bg-gray-100 border-t border-gray-200 py-4 text-center text-gray-500 text-xs">
        YAM Games &copy; 2026 - جميع الحقوق محفوظة
    </footer>

    <!-- سكريبت الحروف العشوائية والتغيير الفوري -->
    <script>
        const questionPool = [
            { letter: 'أ', q: 'ما هو أطول نهر في العالم؟' },
            { letter: 'ب', q: 'دولة عاصمتها برلين؟' },
            { letter: 'ت', q: 'حيوان يحب الموز ويشبه الإنسان؟' },
            { letter: 'ث', q: 'كم ثانية في الدقيقة الواحدة؟' },
            { letter: 'ج', q: 'ما هو أكبر كوكب في المجموعة الشمسية؟' },
            { letter: 'ح', q: 'عاصمة المملكة العربية السعودية؟' },
            { letter: 'خ', q: 'أسرع حيوان بري في العالم؟' },
            { letter: 'د', q: 'عنصر كيميائي رمزه Au؟' },
            { letter: 'ر', q: 'سورة قرآنية تسمى قلب القرآن؟' },
            { letter: 'ز', q: 'معدن ثمين يُقاس بالأونصة؟' },
            { letter: 'س', q: 'نبي ألقي في النار فجعلها برداً وسلاماً؟' },
            { letter: 'ش', q: 'ما هي عاصمة مصر؟' },
            { letter: 'ص', q: 'في أي دولة تقع إسطنبول؟' },
            { letter: 'ض', q: 'عدد ركعات صلاة الفجر؟' },
            { letter: 'ط', q: 'حيوان يُسمى أبا الحصين؟' },
            { letter: 'ظ', q: 'غاز يتنفسه الإنسان؟' },
            { letter: 'ع', q: 'أول غزوة في الإسلام؟' },
            { letter: 'غ', q: 'عاصمة فرنسا؟' },
            { letter: 'ف', q: 'عاصمة إيطاليا؟' },
            { letter: 'ق', q: 'ما هو الحيوان الذي يسمى بأسف ليل؟' }
        ];

        let currentLettersData = [];
        let currentActiveIndex = null;
        let timer = null;
        let timeLeft = 15;
        let currentTurn = 'red';
        let scoreRed = 0;
        let scoreGreen = 0;

        // خلط الحروف عشوائياً وتغيير اللوحة فوراً
        function resetBoardRandomly() {
            let shuffled = [...questionPool].sort(() => 0.5 - Math.random());
            currentLettersData = shuffled.slice(0, 18).map(item => ({ ...item, owner: null }));
            renderBoard();
        }

        function renderBoard() {
            let gridEl = document.getElementById('board-grid');
            let html = '';
            currentLettersData.forEach((item, index) => {
                let bgColor = 'bg-white text-gray-800 hover:bg-gray-100 border border-gray-300 shadow-sm';
                if (item.owner === 'red') bgColor = 'bg-red-600 text-white shadow-md border-red-500';
                if (item.owner === 'green') bgColor = 'bg-green-600 text-white shadow-md border-green-500';

                html += `<div onclick="selectCell(${index})" class="hexagon h-12 flex items-center justify-center font-black text-sm cursor-pointer ${bgColor} transition transform hover:scale-105">
                    ${item.letter}
                </div>`;
            });
            gridEl.innerHTML = html;
        }

        function selectCell(index) {
            if (currentLettersData[index].owner !== null) return;
            currentActiveIndex = index;

            document.getElementById('modal-letter').innerText = 'حرف ' + currentLettersData[index].letter;
            document.getElementById('modal-question').innerText = currentLettersData[index].q;
            document.getElementById('question-modal').classList.remove('hidden');

            startTimer();
        }

        function startTimer() {
            clearInterval(timer);
            timeLeft = 15;
            document.getElementById('timer-display').innerText = timeLeft;
            
            timer = setInterval(() => {
                timeLeft--;
                document.getElementById('timer-display').innerText = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(timer);
                    closeQuestion(true);
                }
            }, 1000);
        }

        function answerResult(team) {
            clearInterval(timer);
            currentLettersData[currentActiveIndex].owner = team;
            
            if(team === 'red') scoreRed++;
            else scoreGreen++;

            document.getElementById('score-red').innerText = scoreRed;
            document.getElementById('score-green').innerText = scoreGreen;

            currentTurn = currentTurn === 'red' ? 'green' : 'red';
            updateTurnText();

            closeQuestion(false);
            renderBoard();
        }

        function closeQuestion(isTimeout) {
            clearInterval(timer);
            document.getElementById('question-modal').classList.add('hidden');
            if(isTimeout) {
                currentTurn = currentTurn === 'red' ? 'green' : 'red';
                updateTurnText();
            }
        }

        function updateTurnText() {
            let el = document.getElementById('turn-indicator');
            if(currentTurn === 'red') {
                el.innerHTML = 'دور الفريق: <span class="text-red-600">الفريق الأحمر</span>';
            } else {
                el.innerHTML = 'دور الفريق: <span class="text-green-700">الفريق الأخضر</span>';
            }
        }

        // بدء اللوحة عند تحميل الصفحة
        window.onload = function() {
            resetBoardRandomly();
        }
    </script>
</body>
</html>
