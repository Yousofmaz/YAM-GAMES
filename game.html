<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة حروف التفاعلية | YAM Games</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        .hexagon { clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%); transition: all 0.3s ease; }
        .bg-pattern {
            background-image: radial-gradient(rgba(34, 197, 94, 0.1) 1px, transparent 1px);
            background-size: 24px 24px;
        }
    </style>
</head>
<body class="bg-gray-950 text-white font-sans min-h-screen flex flex-col justify-between bg-pattern select-none">

    <!-- الهيدر -->
    <header class="bg-gray-900/80 backdrop-blur-md border-b border-green-500/20 p-4 sticky top-0 z-50">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-black text-green-400">لعبة حروف التفاعلية 🎯</h1>
            <a href="index.html" class="bg-gray-800 hover:bg-gray-700 text-gray-300 px-3 py-1.5 rounded-xl text-xs font-bold transition">العودة للمتجر ↗</a>
        </div>
    </header>

    <!-- المحتوى الرئيسي للعبة -->
    <main class="max-w-3xl mx-auto p-4 flex-1 flex flex-col items-center justify-center w-full">
        <div class="mb-6 text-center w-full bg-gray-900/60 border border-gray-800 p-4 rounded-2xl shadow-xl">
            <h2 id="turn-indicator" class="text-base font-bold text-yellow-400 mb-2">دور الفريق: <span class="text-red-400">الفريق الأحمر</span></h2>
            <div class="flex justify-center gap-6 text-xs font-bold">
                <span class="bg-red-600/20 text-red-400 px-3 py-1 rounded-lg border border-red-500/30">نقاط الأحمر: <span id="score-red">0</span></span>
                <span class="bg-green-600/20 text-green-400 px-3 py-1 rounded-lg border border-green-500/30">نقاط الأخضر: <span id="score-green">0</span></span>
            </div>
        </div>

        <!-- شبكة الحروف السداسية -->
        <div id="board-grid" class="grid grid-cols-6 gap-2.5 max-w-xl mx-auto p-5 bg-gray-900/80 rounded-2xl border border-gray-800 shadow-2xl"></div>
    </main>

    <!-- نافذة السؤال والمؤقت المنبثقة -->
    <div id="question-modal" class="fixed inset-0 bg-black/80 hidden z-50 flex items-center justify-center p-4">
        <div class="bg-gray-900 border border-green-500/40 w-full max-w-md rounded-2xl p-6 shadow-2xl text-center relative">
            <div class="absolute top-4 left-4 bg-gray-950 px-3.5 py-1.5 rounded-xl border border-gray-800 text-lg font-mono text-yellow-400" id="timer-display">15</div>
            
            <span id="modal-letter" class="bg-green-500/20 text-green-400 px-4 py-1.5 rounded-full text-xs font-black inline-block mb-3">حرف</span>
            <h3 id="modal-question" class="text-base font-bold text-gray-100 mb-6 leading-relaxed">السؤال...</h3>

            <div class="grid grid-cols-2 gap-3 mb-3">
                <button onclick="answerResult('red')" class="bg-red-600 hover:bg-red-500 text-white font-black py-3 rounded-xl text-xs transition shadow-lg shadow-red-600/20">إجابة صحيحة (أحمر)</button>
                <button onclick="answerResult('green')" class="bg-green-600 hover:bg-green-500 text-white font-black py-3 rounded-xl text-xs transition shadow-lg shadow-green-600/20">إجابة صحيحة (أخضر)</button>
            </div>
            <button onclick="closeQuestion(true)" class="w-full bg-gray-800 hover:bg-gray-700 text-gray-400 py-2.5 rounded-xl text-xs transition">تخطي / انتهى الوقت</button>
        </div>
    </div>

    <!-- الفوتر -->
    <footer class="bg-gray-900 border-t border-gray-800 py-4 text-center text-gray-500 text-xs">
        YAM Games &copy; 2026
    </footer>

    <!-- سكريبت تشغيل اللعبة والأصوات -->
    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (audioCtx.state === 'suspended') { audioCtx.resume(); }
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'click') {
                osc.frequency.setValueAtTime(500, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                osc.start(); osc.stop(audioCtx.currentTime + 0.1);
            } else if (type === 'success') {
                osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(659.25, audioCtx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start(); osc.stop(audioCtx.currentTime + 0.3);
            } else if (type === 'timeout') {
                osc.frequency.setValueAtTime(180, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
                osc.start(); osc.stop(audioCtx.currentTime + 0.4);
            }
        }

        const lettersData = [
            { letter: 'أ', q: 'ما هو أطول نهر في العالم؟', owner: null },
            { letter: 'ب', q: 'دولة عاصمتها برلين؟', owner: null },
            { letter: 'ت', q: 'حيوان يحب الموز ويشبه الإنسان؟', owner: null },
            { letter: 'ث', q: 'كم ثانية في الدقيقة الواحدة؟', owner: null },
            { letter: 'ج', q: 'ما هو أكبر كوكب في المجموعة الشمسية؟', owner: null },
            { letter: 'ح', q: 'عاصمة المملكة العربية السعودية؟', owner: null },
            { letter: 'خ', q: 'أسرع حيوان بري في العالم؟', owner: null },
            { letter: 'د', q: 'عنصر كيميائي رمزه Au؟', owner: null },
            { letter: 'ر', q: 'سورة قرآنية تسمى قلب القرآن؟', owner: null },
            { letter: 'ز', q: 'معدن ثمين يُقاس بالأونصة؟', owner: null },
            { letter: 'س', q: 'نبي ألقي في النار فجعلها برداً وسلاماً؟', owner: null },
            { letter: 'ش', q: 'ما هي عاصمة مصر؟', owner: null },
            { letter: 'ص', q: 'في أي دولة تقع إسطنبول؟', owner: null },
            { letter: 'ض', q: 'عدد ركعات صلاة الفجر؟', owner: null },
            { letter: 'ط', q: 'حيوان يُسمى أبا الحصين؟', owner: null },
            { letter: 'ظ', q: 'غاز يتنفسه الإنسان؟', owner: null },
            { letter: 'ع', q: 'أول غزوة في الإسلام؟', owner: null },
            { letter: 'غ', q: 'عاصمة فرنسا؟', owner: null }
        ];

        let currentActiveIndex = null;
        let timer = null;
        let timeLeft = 15;
        let currentTurn = 'red';
        let scoreRed = 0;
        let scoreGreen = 0;

        function renderBoard() {
            let gridEl = document.getElementById('board-grid');
            let html = '';
            lettersData.forEach((item, index) => {
                let bgColor = 'bg-gray-800 text-gray-200 hover:bg-gray-700 border border-gray-700';
                if (item.owner === 'red') bgColor = 'bg-red-600 text-white shadow-md shadow-red-600/40 border-red-500';
                if (item.owner === 'green') bgColor = 'bg-green-600 text-white shadow-md shadow-green-600/40 border-green-500';

                html += `<div onclick="selectCell(${index})" class="hexagon h-12 flex items-center justify-center font-black text-base cursor-pointer ${bgColor} transition transform hover:scale-105">
                    ${item.letter}
                </div>`;
            });
            gridEl.innerHTML = html;
        }

        function selectCell(index) {
            if (lettersData[index].owner !== null) return;
            playSound('click');
            currentActiveIndex = index;

            document.getElementById('modal-letter').innerText = 'حرف ' + lettersData[index].letter;
            document.getElementById('modal-question').innerText = lettersData[index].q;
            document.getElementById('question-modal').classList.remove('hidden');

            startTimer();
        }

        function startTimer() {
            clearInterval(timer);
            timeLeft = 15;
            document.getElementById('timer-display').innerText = timeLeft;
            
            timer = setInterval(() => {
                timeLeft--;
                document.getElementById('timer-display').innerText = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(timer);
                    playSound('timeout');
                    closeQuestion(true);
                }
            }, 1000);
        }

        function answerResult(team) {
            clearInterval(timer);
            playSound('success');
            lettersData[currentActiveIndex].owner = team;
            
            if(team === 'red') scoreRed++;
            else scoreGreen++;

            document.getElementById('score-red').innerText = scoreRed;
            document.getElementById('score-green').innerText = scoreGreen;

            currentTurn = currentTurn === 'red' ? 'green' : 'red';
            updateTurnText();

            closeQuestion(false);
            renderBoard();
        }

        function closeQuestion(isTimeout) {
            clearInterval(timer);
            document.getElementById('question-modal').classList.add('hidden');
            if(isTimeout) {
                currentTurn = currentTurn === 'red' ? 'green' : 'red';
                updateTurnText();
            }
        }

        function updateTurnText() {
            let el = document.getElementById('turn-indicator');
            if(currentTurn === 'red') {
                el.innerHTML = 'دور الفريق: <span class="text-red-400">الفريق الأحمر</span>';
            } else {
                el.innerHTML = 'دور الفريق: <span class="text-green-400">الفريق الأخضر</span>';
            }
        }

        renderBoard();
    </script>
</body>
</html>
