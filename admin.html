<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم | YAM Games</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-950 text-white font-sans min-h-screen flex flex-col justify-between select-none">

    <!-- 1. شاشة تسجيل الدخول -->
    <div id="login-screen" class="fixed inset-0 bg-gray-950 z-50 flex items-center justify-center p-4">
        <div class="bg-gray-900 border border-green-500/30 w-full max-w-md rounded-2xl p-8 shadow-2xl">
            <div class="text-center mb-6">
                <h2 class="text-2xl font-black text-green-400 mb-2">لوحة إدارة YAM Games ⚙️</h2>
                <p class="text-gray-400 text-xs">يرجى تسجيل الدخول برقمك الوظيفي وكلمة المرور للمتابعة</p>
            </div>
            <form onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-gray-300 mb-1">الرقم الوظيفي</label>
                    <input type="text" id="emp-id" required placeholder="مثال: 1001" class="w-full bg-gray-950 border border-gray-800 rounded-xl px-4 py-3 text-sm text-white focus:border-green-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-300 mb-1">كلمة المرور</label>
                    <input type="password" id="emp-pass" required placeholder="••••••••" class="w-full bg-gray-950 border border-gray-800 rounded-xl px-4 py-3 text-sm text-white focus:border-green-500 outline-none">
                </div>
                <button type="submit" class="w-full bg-green-600 hover:bg-green-500 text-gray-950 font-black py-3 rounded-xl text-sm transition shadow-lg shadow-green-600/20">
                    دخول للوحة التحكم ↗
                </button>
            </form>
        </div>
    </div>

    <!-- الهيدر -->
    <header class="bg-gray-900 border-b border-green-500/20 p-4 shadow-lg">
        <div class="max-w-5xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-black text-green-400">لوحة التحكم والتحليلات ⚙️</h1>
            <div class="flex gap-3">
                <a href="index.html" target="_blank" class="bg-gray-800 hover:bg-gray-700 text-gray-300 px-3 py-1.5 rounded-xl text-xs font-bold transition">عرض المتجر ↗</a>
                <button onclick="logout()" class="bg-red-600/20 hover:bg-red-600/30 text-red-400 px-3 py-1.5 rounded-xl text-xs font-bold transition">خروج</button>
            </div>
        </div>
    </header>

    <!-- المحتوى الرئيسي للوحة -->
    <main class="max-w-5xl mx-auto p-6 flex-1 w-full space-y-6">

        <!-- 2. قسم الإحصائيات (الزيارات والمبيعات) -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div class="bg-gray-900 border border-gray-800 p-5 rounded-2xl shadow-xl flex items-center justify-between">
                <div>
                    <p class="text-gray-400 text-xs font-bold mb-1">إجمالي زيارات المتجر</p>
                    <h3 class="text-3xl font-black text-green-400" id="stat-visits">1,240</h3>
                </div>
                <span class="text-3xl bg-green-500/10 p-3 rounded-2xl border border-green-500/20">👥</span>
            </div>

            <div class="bg-gray-900 border border-gray-800 p-5 rounded-2xl shadow-xl flex items-center justify-between">
                <div>
                    <p class="text-gray-400 text-xs font-bold mb-1">الألعاب المباعة</p>
                    <h3 class="text-3xl font-black text-yellow-400" id="stat-sales">86</h3>
                </div>
                <span class="text-3xl bg-yellow-500/10 p-3 rounded-2xl border border-yellow-500/20">🎮</span>
            </div>

            <div class="bg-gray-900 border border-gray-800 p-5 rounded-2xl shadow-xl flex items-center justify-between">
                <div>
                    <p class="text-gray-400 text-xs font-bold mb-1">إجمالي الأرباح</p>
                    <h3 class="text-3xl font-black text-blue-400" id="stat-revenue">$859.14</h3>
                </div>
                <span class="text-3xl bg-blue-500/10 p-3 rounded-2xl border border-blue-500/20">💰</span>
            </div>
        </div>

        <!-- 3. إدارة وتعديل الألعاب -->
        <div class="bg-gray-900 border border-gray-800 p-6 rounded-2xl shadow-xl">
            <h3 class="text-lg font-black text-white mb-4 border-b border-gray-800 pb-3">تعديل بيانات الألعاب (تحديث فوري للمتجر)</h3>
            
            <div class="space-y-4" id="games-edit-container">
                <!-- يتم تعبئتها ديناميكياً -->
            </div>
        </div>

    </main>

    <!-- الفوتر -->
    <footer class="bg-gray-900 border-t border-gray-800 py-4 text-center text-gray-500 text-xs">
        YAM Games Admin Panel &copy; 2026
    </footer>

    <!-- السكريبت والربط -->
    <script>
        // التحقق من تسجيل الدخول
        function handleLogin(e) {
            e.preventDefault();
            const id = document.getElementById('emp-id').value;
            const pass = document.getElementById('emp-pass').value;
            
            // بيانات تجريبية للدخول (يمكنك تعديلها)
            if(id && pass) {
                localStorage.setItem('yam_admin_logged', 'true');
                document.getElementById('login-screen').classList.add('hidden');
                loadStats();
                loadEditor();
            } else {
                alert('الرجاء إدخال البيانات بشكل صحيح');
            }
        }

        function logout() {
            localStorage.removeItem('yam_admin_logged');
            document.getElementById('login-screen').classList.remove('hidden');
        }

        // عند فتح الصفحة تحقق هل مسجل دخول مسبقاً
        window.onload = function() {
            if(localStorage.getItem('yam_admin_logged') === 'true') {
                document.getElementById('login-screen').classList.add('hidden');
                loadStats();
                loadEditor();
            }
        }

        function loadStats() {
            // محاكاة سحب إحصائيات حية وتخزينها
            let visits = localStorage.getItem('yam_visits') || 1240;
            let sales = localStorage.getItem('yam_sales') || 86;
            document.getElementById('stat-visits').innerText = visits;
            document.getElementById('stat-sales').innerText = sales;
        }

        // جلب وحفظ تعديلات الألعاب لترتبط بالمتجر الرئيسي مباشرة
        function loadEditor() {
            let gameName = localStorage.getItem('yam_game_name') || 'لعبة حروف التفاعلية';
            let gameDesc = localStorage.getItem('yam_game_desc') || 'لعبة مسابقات ثقافية جماعية بفريقين، تحتوي على أصوات تفاعلية ومؤقت زمني 15 ثانية.';
            let gamePrice = localStorage.getItem('yam_game_price') || '9.99';

            let html = `
                <div class="bg-gray-950 p-4 rounded-xl border border-gray-800 space-y-3">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-bold text-gray-400 mb-1">اسم اللعبة</label>
                            <input type="text" id="edit-name" value="${gameName}" class="w-full bg-gray-900 border border-gray-800 rounded-lg p-2.5 text-sm text-white focus:border-green-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-400 mb-1">السعر ($)</label>
                            <input type="text" id="edit-price" value="${gamePrice}" class="w-full bg-gray-900 border border-gray-800 rounded-lg p-2.5 text-sm text-white focus:border-green-500 outline-none">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-400 mb-1">وصف اللعبة</label>
                        <textarea id="edit-desc" rows="2" class="w-full bg-gray-900 border border-gray-800 rounded-lg p-2.5 text-sm text-white focus:border-green-500 outline-none">${gameDesc}</textarea>
                    </div>
                    <button onclick="saveGameChanges()" class="bg-green-600 hover:bg-green-500 text-gray-950 font-black px-4 py-2 rounded-lg text-xs transition">
                        حفظ التعديلات وتحديث المتجر الرئيسي ✓
                    </button>
                </div>
            `;
            document.getElementById('games-edit-container').innerHTML = html;
        }

        function saveGameChanges() {
            let newName = document.getElementById('edit-name').value;
            let newDesc = document.getElementById('edit-desc').value;
            let newPrice = document.getElementById('edit-price').value;

            localStorage.setItem('yam_game_name', newName);
            localStorage.setItem('yam_game_desc', newDesc);
            localStorage.setItem('yam_game_price', newPrice);

            alert('تم حفظ التعديلات بنجاح! ستظهر فوراً في المتجر الرئيسي.');
        }
    </script>
</body>
</html>
